name: Deploy Atmos to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image compositor
        run: python3 -m pip install --quiet --break-system-packages Pillow
      - name: Build full-world satellite mosaic
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, time, urllib.parse, urllib.request
          from io import BytesIO
          from PIL import Image, ImageChops, ImageStat

          ROOT = 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi'
          SIZE = (2048, 1024)
          TODAY = datetime.datetime.now(datetime.timezone.utc).date()
          def download(layer, date=None, transparent=False):
              params = {
                  'SERVICE': 'WMS', 'VERSION': '1.1.1', 'REQUEST': 'GetMap',
                  'LAYERS': layer, 'STYLES': '',
                  'FORMAT': 'image/png' if transparent else 'image/jpeg',
                  'TRANSPARENT': 'TRUE' if transparent else 'FALSE',
                  'SRS': 'EPSG:4326', 'BBOX': '-180,-90,180,90',
                  'WIDTH': str(SIZE[0]), 'HEIGHT': str(SIZE[1])
              }
              if date: params['TIME'] = str(date)
              url = ROOT + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'Atmos-Weather-Globe/1.0'})
              with urllib.request.urlopen(req, timeout=45) as resp: data = resp.read()
              im = Image.open(BytesIO(data))
              im.load()
              if im.size != SIZE: raise ValueError('Incorrect image dimensions')
              return im.convert('RGBA'), len(data)

          # NASA's full-world Blue Marble is an observed (but not current) fallback,
          # preventing missing satellite swaths from appearing as black continents.
          try:
              background, size = download('BlueMarble_NextGeneration')
              print('Loaded Blue Marble fallback', size, flush=True)
          except Exception as exc:
              print('Blue Marble unavailable:', exc, flush=True)
              background = Image.new('RGBA', SIZE, (22, 64, 107, 255))

          mosaic = background.copy()
          dates = []
          coverage = Image.new('L', SIZE, 0)
          # Oldest-to-newest composition ensures fresher observations take priority.
          for offset in [7,6,5,4,3,2,1]:
              date = str(TODAY - datetime.timedelta(days=offset))
              try:
                  layer, size = download('VIIRS_SNPP_CorrectedReflectance_TrueColor', date, True)
                  alpha = layer.getchannel('A')
                  # WMS can use nearly-black "no data" pixels as well as alpha gaps.
                  rgb = layer.convert('RGB')
                  no_data = rgb.point(lambda p: 255 if p < 4 else 0).convert('L')
                  # A pixel is missing only if all 3 channels are nearly black.
                  channels = rgb.split()
                  nearly_black = ImageChops.multiply(ImageChops.multiply(
                      channels[0].point(lambda p: 255 if p < 4 else 0),
                      channels[1].point(lambda p: 255 if p < 4 else 0)),
                      channels[2].point(lambda p: 255 if p < 4 else 0))
                  alpha = ImageChops.subtract(alpha, nearly_black)
                  layer.putalpha(alpha)
                  mosaic.alpha_composite(layer)
                  coverage = ImageChops.lighter(coverage, alpha)
                  dates.append(date)
                  print('Composited', date, size, 'bytes', flush=True)
              except Exception as exc:
                  print('Skipping', date, str(exc), flush=True)

          if not dates:
              print('No recent satellite imagery; publishing fallback only', flush=True)

          mosaic.convert('RGB').save('satellite.jpg', 'JPEG', quality=90, optimize=True)
          coverage_percent = round(ImageStat.Stat(coverage).mean[0] / 255 * 100, 1)
          pathlib.Path('satellite.json').write_text(json.dumps({
              'date': max(dates) if dates else None,
              'dates': dates, 'source': 'NASA GIBS',
              'mosaic': True, 'recentCoveragePercent': coverage_percent,
              'baseLayer': 'BlueMarble_NextGeneration',
              'updated': datetime.datetime.now(datetime.timezone.utc).isoformat()
          }))
          print('Finished global mosaic: recent coverage', coverage_percent, '%', flush=True)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
