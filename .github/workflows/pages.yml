name: Deploy Atmos to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild satellite snapshot twice daily (UTC)
    - cron: '20 6,18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Fetch recent true-color NASA satellite image
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, urllib.parse, urllib.request, pathlib, json, time
          base = 'https://gibs.earthdata.nasa.gov/wms/epsg4326/best/wms.cgi'
          today = datetime.datetime.now(datetime.timezone.utc).date()
          layer = 'VIIRS_SNPP_CorrectedReflectance_TrueColor'
          for ago in [1, 2, 3, 4, 5, 6, 7]:
              date = str(today - datetime.timedelta(days=ago))
              params = {
                  'SERVICE': 'WMS', 'VERSION': '1.1.1', 'REQUEST': 'GetMap',
                  'LAYERS': layer, 'STYLES': '', 'FORMAT': 'image/jpeg',
                  'SRS': 'EPSG:4326', 'BBOX': '-180,-90,180,90',
                  'WIDTH': '2048', 'HEIGHT': '1024', 'TIME': date,
              }
              url = base + '?' + urllib.parse.urlencode(params)
              for attempt in range(2):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Atmos-Weather-Globe/1.0'})
                      with urllib.request.urlopen(req, timeout=65) as resp:
                          data = resp.read()
                      if not data.startswith(b'\xff\xd8\xff') or not data.endswith(b'\xff\xd9') or len(data) < 25000:
                          raise ValueError('Invalid or too-small JPEG satellite image')
                      pathlib.Path('satellite.jpg').write_bytes(data)
                      pathlib.Path('satellite.json').write_text(json.dumps({
                          'date': date, 'source': 'NASA GIBS', 'layer': layer,
                          'updated': datetime.datetime.now(datetime.timezone.utc).isoformat()
                      }))
                      print(f'Satellite image ready: {date}, {len(data)} bytes')
                      raise SystemExit(0)
                  except Exception as e:
                      print(f'{date} attempt {attempt+1} failed: {e}', flush=True)
                      time.sleep(2)
          # Preserve site access even if the provider is temporarily unavailable.
          pathlib.Path('satellite.json').write_text(json.dumps({'error': 'NASA imagery unavailable', 'updated': datetime.datetime.now(datetime.timezone.utc).isoformat()}))
          print('No valid satellite image; website will use its fallback texture')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
